name: Issue priority

# Automated triage under ADR-0003 (rules in sections 1-4, this workflow in 5). When an
# issue has no `priority:*` label, .github/triage/triage_priority.py asks Claude once to
# classify it and then sets type, severity, reach, area and priority labels, an assignee
# and one comment. It never sets the milestone, so the start of PDCA work stays the
# maintainer's decision.
#
# Two jobs, because GitHub scopes the token's permissions per job, not per step
# (ADR-0003 sections 4 and 5). `classify` runs the model with a read-only token and
# writes the plan as an artifact; it cannot write to GitHub. `apply` has `issues: write`,
# runs no model and installs no SDK, and checks every label in the plan against
# labels.json before writing. A back-fill adds a third job, `dispatch`, which runs no model
# and only starts one run of this workflow per issue (actions: write), so every issue is
# triaged in its own concurrency group.
#
# An issue holding a checksum-valid IBAN, a credential of a known shape or a GnuCash
# account path is not sent to the model at all: the classify job checks for them before
# any call, plans only `needs-triage` and a request to replace the data, and the issue is
# triaged again after the edit.
#
# Cost is bounded by design: one request per issue, capped input, low effort, and no
# second pass on an edit unless the issue was left at `needs-triage`. Anyone can open an
# issue on this public repository, so the backstop is the spending limit on the Claude
# workspace the service account acts in, not anything in this file.
#
# Issue text is untrusted. It never reaches a shell here (no `${{ github.event.issue.* }}`
# in a run step); the script reads it from the API and passes it to the model as data.
# The model gets no token and no tools; the script validates its JSON before writing.
#
# No API key is stored. The classify job asks GitHub for a short-lived OIDC identity token
# and the SDK exchanges it for a Claude API token (Workload Identity Federation,
# ADR-0003), fetching a new identity token at every exchange so a long back-fill does not
# outlive it. The federation rule only accepts runs on refs/heads/main of this repository,
# which covers issue events and manual runs from main but not pull requests or other
# branches.

on:
  issues:
    types: [opened, reopened, edited]
  pull_request:
    paths:
      - ".github/triage/**"
      - ".github/workflows/triage-priority.yml"
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to triage (empty = back-fill: one run per open issue without a priority)"
        required: false
      limit:
        description: "Most issues to triage when no number is given"
        required: false
        default: "20"
      dry_run:
        description: "Classify and print the plan, write nothing"
        type: boolean
        default: false
      check:
        description: "Only test the Claude API sign-in with one tiny request"
        type: boolean
        default: false

permissions:
  contents: read

# One group per issue, so two runs never triage the same issue at once. A back-fill does
# not classify anything in its own run: its `dispatch` job starts one run per issue, and
# each of those joins its issue's group (#70). Sharing one group for everything would not
# work: GitHub keeps only one pending run per group, so queued issue events would cancel
# each other.
concurrency:
  group: issue-priority-${{ github.event.issue.number || inputs.issue || github.event.pull_request.number || 'backfill' }}
  cancel-in-progress: false

jobs:
  test:
    name: triage tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Unit tests (offline, no SDK needed)
        run: python -I -m unittest discover -s .github/triage -v

  dispatch:
    name: dispatch
    # The back-fill: a manual run with no issue number that writes (not a dry run or check).
    if: >-
      github.event_name == 'workflow_dispatch' && !inputs.issue && !inputs.dry_run
      && !inputs.check
    runs-on: ubuntu-latest
    # Finds the issues and starts a run of this workflow for each; runs no model and
    # writes nothing to issues. `actions: write` is what starting a run needs.
    permissions:
      contents: read
      issues: read
      actions: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Start one triage run per issue
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_LIMIT: ${{ inputs.limit }}
          REF: ${{ github.ref_name }}
        # The script rejects a limit below 1 (#68).
        run: python -I .github/triage/triage_priority.py dispatch --limit "${INPUT_LIMIT:-20}" --ref "$REF"

  classify:
    name: classify
    # Issue events, a manual run for one issue, a check, or a back-fill dry run.
    if: >-
      github.event_name != 'pull_request' && github.actor != 'dependabot[bot]'
      && (github.event_name != 'workflow_dispatch' || inputs.issue || inputs.dry_run
          || inputs.check)
    runs-on: ubuntu-latest
    # Read-only: this job runs the model, so it must not hold a token that can write.
    permissions:
      contents: read
      issues: read
      id-token: write
    timeout-minutes: 15
    outputs:
      plan: ${{ steps.triage.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Check the federation settings
        id: settings
        env:
          RULE: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORG: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ACCOUNT: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Every variable the token exchange needs, so a half-configured repository skips
          # cleanly instead of failing each run in the SDK. The workspace is optional: the
          # rule's own workspace is used when it is not set.
          missing=()
          [ -n "${RULE:-}" ] || missing+=(ANTHROPIC_FEDERATION_RULE_ID)
          [ -n "${ORG:-}" ] || missing+=(ANTHROPIC_ORGANIZATION_ID)
          [ -n "${ACCOUNT:-}" ] || missing+=(ANTHROPIC_SERVICE_ACCOUNT_ID)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::Not set: ${missing[*]}; skipping automated triage."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - name: Install the pinned, hash-checked SDK (ADR-0003 section 5)
        if: steps.settings.outputs.enabled == 'true'
        run: python -m pip install --quiet --require-hashes --no-deps -r .github/triage/requirements.txt
      # Both steps below sign in through triage_priority.claude_client, which fetches a new
      # GitHub identity token for every token exchange; one fetched at the start of the job
      # expires after about five minutes and can be exchanged once (#61).
      - name: Check the Claude API connection
        if: steps.settings.outputs.enabled == 'true' && inputs.check
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          python -I - <<'EOF'
          import sys
          sys.path.insert(0, ".github/triage")
          from triage_priority import MODEL, claude_client

          message = claude_client().messages.create(
              model=MODEL, max_tokens=16,
              messages=[{"role": "user", "content": "Reply with the word ok."}],
          )
          text = next((b.text for b in message.content if b.type == "text"), "")
          print(f"Connected: {message.model} replied {text!r} "
                f"({message.usage.input_tokens} in, {message.usage.output_tokens} out)")
          EOF
      - name: Classify
        id: triage
        if: steps.settings.outputs.enabled == 'true' && !inputs.check
        env:
          # Identifiers, not secrets; kept as repository variables.
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          GH_TOKEN: ${{ github.token }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          EVENT_ACTION: ${{ github.event.action }}
          INPUT_ISSUE: ${{ inputs.issue }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${EVENT_ISSUE:-}" ]; then
            args+=(--issue "$EVENT_ISSUE")
            # Only an edit may retry an issue left at needs-triage (the author added information).
            if [ "${EVENT_ACTION:-}" = "edited" ]; then args+=(--retry); fi
          elif [ -n "${INPUT_ISSUE:-}" ]; then
            args+=(--issue "$INPUT_ISSUE")
          else
            # Only a dry run gets here without an issue; a back-fill that writes runs
            # through the dispatch job. The script rejects a limit below 1 (#68).
            args+=(--all --limit "${INPUT_LIMIT:-20}")
          fi
          if [ "${INPUT_DRY_RUN:-false}" = "true" ]; then
            python -I .github/triage/triage_priority.py classify "${args[@]}" --dry-run
            exit 0
          fi
          # Hand on what was classified even when a later issue failed; fail the job after.
          status=0
          python -I .github/triage/triage_priority.py classify "${args[@]}" \
            --out "$RUNNER_TEMP/plan.json" || status=$?
          if [ -s "$RUNNER_TEMP/plan.json" ] && [ "$(jq length "$RUNNER_TEMP/plan.json")" -gt 0 ]; then
            echo "plan=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Hand the plan to the apply job
        if: always() && steps.triage.outputs.plan == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-plan
          path: ${{ runner.temp }}/plan.json
          retention-days: 7

  apply:
    name: apply
    needs: classify
    if: always() && needs.classify.outputs.plan == 'true'
    runs-on: ubuntu-latest
    # Writes to issues; runs no model and installs no SDK.
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: triage-plan
          path: ${{ runner.temp }}/triage-plan
      - name: Check the plan and apply it
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I .github/triage/triage_priority.py apply --plan "$RUNNER_TEMP/triage-plan/plan.json"
