[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autobook"
version = "0.0.0"
description = "Automatic destination-account assignment for GnuCash bank imports"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Eduard Ralph", email = "eduard@ralphovi.net" }]
keywords = ["gnucash", "accounting", "bookkeeping", "ofx", "classification"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: End Users/Desktop",
    "Environment :: Console",
    "Natural Language :: English",
    "Natural Language :: German",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Accounting",
]
# Deliberately empty. The pipeline's runtime dependencies (scikit-learn,
# ofxstatement, …) land with the code that needs them — build order step 2 —
# rather than being declared speculatively. The applier's dependency,
# python3-gnucash, is a SYSTEM package in dist-packages and is never declared
# here; see ADR-0002 and the pipeline/applier boundary in AGENTS.md.
dependencies = []

[project.urls]
Homepage = "https://github.com/Ralphovi/autobook"
Issues = "https://github.com/Ralphovi/autobook/issues"
Source = "https://github.com/Ralphovi/autobook"

[tool.hatch.build.targets.wheel]
packages = ["src/autobook"]

# ---------------------------------------------------------------------------
# Lint / format. Single source: `nox -s gate` runs these; CI runs the same.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 96
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "B",         # bugbear
    "UP",        # pyupgrade
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "PL",        # pylint subset
    "T20",       # no print() in library code
    "S",         # bandit — security
    "PT",        # pytest style
    "TID",       # tidy imports
]
ignore = [
    "PLR0913",   # argument count — judged in review, not mechanically
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, use fixtures with shadowing names, and may hardcode sample data.
"tests/**" = ["S101", "PLR2004"]
# noxfile drives subprocesses by design.
"noxfile.py" = ["S603", "S607"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The pipeline/applier boundary, enforced mechanically rather than by review.
# Only the applier may import gnucash; it carries a per-file ignore when it
# arrives (build order step 5). See AGENTS.md.
"gnucash".msg = "Only the applier may import gnucash — the pipeline must run with no GnuCash installed. See AGENTS.md."

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# python3-gnucash ships no type stubs and is not installed outside the applier
# session; do not fail the gate on its absence.
module = ["gnucash.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "applier: requires the system python3-gnucash; excluded from the default gate",
]

[tool.coverage.run]
branch = true
source = ["src/autobook"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
